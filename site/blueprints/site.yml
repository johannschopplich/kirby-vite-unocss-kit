title:
  de: Seite
  en: Site

tabs:
  dashboard:
    label:
      de: Übersicht
      en: Dashboard
    icon: dashboard
    columns:
      - width: 1/1
        fields:
          pages:
            type: pagelist
            headline:
              de: Seiten
              en: Pages
            status: all
            create: default
            info: "/{{ page.slug }}"
            image: page.thumbnail.toFile

  settings:
    label:
      de: Einstellungen
      en: Settings
    icon: settings
    columns:
      - width: 1/1
        fields:
          meta:
            extends: fields/meta
            fields:
              thumbnail:
                query: kirby.site.files.template('image')
                uploads:
                  parent: kirby.site
                  template: image
